# Release: build the installable artifacts for a tag and publish them.
#
# Push a `v*` tag and this builds the desktop installers on macOS, Windows and
# Linux, then creates the GitHub release with the matching CHANGELOG section as
# its notes and every installer attached.
#
# NO Python artifact is built, deliberately. `setup.py` blocks `bdist_wheel` and
# `sdist` outside a Nix build (see its module docstring, and
# tests/packaging/test_packaging_build_guard.py): a wheel would ship without the
# bundled skills, web_dist, tui_dist and plugin manifests. PyPI is a roadmap
# item. Until that guard is lifted, the Python install path is
# `scripts/install.sh` (git clone + uv) and there is nothing to attach here.
#
# Dry run before tagging: Actions -> Release -> Run workflow, pick a ref, tick
# `draft`. That builds everything and leaves the release unpublished.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist unless draft)'
        required: true
      draft:
        description: 'Create the release as a draft (dry run)'
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time per tag, and never cancel a partly-uploaded one.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Fail in seconds on a mistyped tag rather than after three OS builds.
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: version
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION from tag $RELEASE_TAG"

      # Every version source must agree with each other AND with the tag.
      # Stdlib only, so the runner's python3 is enough — no toolchain setup.
      - run: python3 scripts/check_version_sync.py --expect "$RELEASE_TAG"

      # Release notes come from the CHANGELOG; an unwritten entry means the
      # release would ship with empty or wrong notes.
      - name: Require a CHANGELOG entry
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -qE "^## ${VERSION//./\\.}( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section — write the entry before tagging."
            exit 1
          fi

  desktop:
    name: Desktop (${{ matrix.label }})
    needs: verify
    timeout-minutes: 90
    strategy:
      fail-fast: false # one platform failing shouldn't lose the other two
      matrix:
        include:
          # Apple silicon only. An Intel build is NOT cross-compiled here on
          # purpose: the desktop stages prebuilt native deps (node-pty) for the
          # host arch, so `--x64` from an arm runner would package arm binaries
          # into an x64 installer that fails at launch. Shipping Intel needs an
          # Intel runner and a matrix entry, not a flag.
          - os: macos-latest
            label: macOS arm64
            script: dist:mac
          - os: windows-latest
            label: Windows
            script: dist:win
          - os: ubuntu-latest
            label: Linux
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # rpm targets need rpmbuild; the ubuntu image doesn't carry it.
      - name: Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y rpm

      # Lifecycle scripts run here on purpose (unlike the repo's usual
      # --ignore-scripts): electron's postinstall fetches the prebuilt binary
      # and the native deps need their build step, both of which ARE the
      # artifact being shipped.
      - uses: ./.github/actions/retry
        with:
          command: npm ci

      - name: Build installers
        working-directory: apps/desktop
        env:
          # Signing/notarization run only when the secrets exist. Without them
          # electron-builder produces unsigned artifacts and notarize.mjs skips
          # itself — the build stays green and the output is still installable,
          # just with an OS warning on first launch.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        # `--publish never` keeps electron-builder from pushing to the GitHub
        # release itself; the publish job owns that, so all three platforms'
        # installers land together in one release rather than racing to create
        # it three times.
        run: npm run ${{ matrix.script }} -- --publish never

      # Only the installables — `release/` also holds unpacked app trees,
      # blockmaps and builder metadata that nobody should download.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [verify, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract release notes
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          # The CHANGELOG section for this version, up to the next `## ` heading.
          awk -v version="$VERSION" '
            $0 ~ "^## " version "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::Extracted empty release notes for $VERSION."
            exit 1
          fi

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ github.event.inputs.draft == 'true' && '--draft' || '' }}
          # A tag push proves the tag exists; a manual dry run may be building a
          # tag that hasn't been cut yet, where --verify-tag would just fail.
          VERIFY_TAG: ${{ github.event_name == 'push' && '--verify-tag' || '' }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "opencodon ${{ needs.verify.outputs.version }}" \
            --notes-file release-notes.md \
            $VERIFY_TAG \
            $DRAFT \
            artifacts/*
